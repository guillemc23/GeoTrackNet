[project]
name = "migration"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "dm-sonnet<2.0.0",
    "protobuf<=3.21.0",
    "tensorflow<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/migration"]

[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
]
