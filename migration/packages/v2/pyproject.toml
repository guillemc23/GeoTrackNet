[project]
name = "migration"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.19.0",
    "tensorflow-probability>=0.25.0",
]

[build-system]
